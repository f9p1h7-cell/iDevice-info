      --ok: #3fb950;
      --ok-soft: rgba(63, 185, 80, 0.14);
      --radius: 10px;

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 20px 16px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 8px;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-links a {
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.88rem;
      font-weight: 500;
    }

    .controls {
      margin: 18px auto 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn:hover { color: var(--text); border-color: #484f58; }

    .tab-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    main { padding-bottom: 48px; }

    .section-block {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .section-header {
      padding: 12px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .count-badge {
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      text-align: left;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.01);
    }

    tr:last-child td { border-bottom: none; }

    .note-box {
      padding: 14px 16px;
      color: var(--text);
      font-size: 0.92rem;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tag-warn { background: var(--warn-soft); color: var(--warn); }
    .tag-ok { background: var(--ok-soft); color: var(--ok); }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      display: none;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 16px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>

    let activeCategory = "all";
    const root = document.getElementById("sectionsRoot");
    const searchBox = document.getElementById("searchBox");
    const emptyState = document.getElementById("emptyState");

    function render() {
      const query = searchBox.value.trim().toLowerCase();
      root.innerHTML = "";
      let totalVisibleRows = 0;

      DATA.forEach((sec) => {
        if (activeCategory !== "all" && sec.category !== activeCategory) return;

        const filteredRows = sec.rows.filter((row) =>
          row.some((cell) => String(cell).toLowerCase().includes(query)) ||
          sec.title.toLowerCase().includes(query)
        );

        if (filteredRows.length === 0) return;
        totalVisibleRows += filteredRows.length;

        const block = document.createElement("section");
        block.className = "section-block";

        const header = document.createElement("div");
        header.className = "section-header";
        header.innerHTML = `<h2>${sec.title}</h2><span class="count-badge">${filteredRows.length}</span>`;
        block.appendChild(header);

        const wrap = document.createElement("div");
        wrap.className = "table-wrap";

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        thead.innerHTML = `<tr>${sec.columns.map((c) => `<th>${c}</th>`).join("")}</tr>`;
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        filteredRows.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = row.map((cell, idx) => {
            if (idx === 1 && sec.category === "horrible" && cell !== "None") {
              return `<td><span class="tag tag-warn">${cell}</span></td>`;
            }
            if (idx === 1 && sec.category === "horrible" && cell === "None") {
              return `<td><span class="tag tag-ok">None</span></td>`;
            }
            return `<td>${cell}</td>`;
          }).join("");
          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        wrap.appendChild(table);
        block.appendChild(wrap);
        root.appendChild(block);
      });

      emptyState.style.display = totalVisibleRows === 0 ? "block" : "none";
    }

    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.cat;
      render();
    });

    searchBox.addEventListener("input", render);
    render();
  </script>
